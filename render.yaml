services:
  - type: web
    name: python-fastapi
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: ENVIRONMENT
        value: production
      - key: DOCS_URL
        value: https://python-fastapi-fhky.onrender.com/docs
